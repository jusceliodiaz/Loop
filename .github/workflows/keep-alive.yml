name: Keep Supabase project awake

# Free-tier Supabase projects pause after a week with no database activity —
# a visit to the dashboard doesn't count, only real query/API traffic does.
# Twice a week is comfortably inside that window. A silent keep-alive that
# quietly stops working is worse than none, so this job is left to fail
# loudly (GitHub emails on workflow failure by default) instead of
# swallowing errors.
on:
  schedule:
    - cron: "0 9 * * 1,4" # Mondays and Thursdays, 09:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 300 ]; then
            echo "::error::Supabase keep-alive ping failed (HTTP $status) — project may pause."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
